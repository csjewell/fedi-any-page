packages:
  - packages/*
linkWorkspacePackages: true
sharedWorkspaceLockfile: false
enableGlobalVirtualStore: true
publishBranch: release
overrides:
  "cacache": "^19.0.1"
  "shelljs": "^0.9.2"
  "node-gyp": "^11.2.0"
  "unplugin-isolated-decl@0.13.11>typescript": "^6.0.2"
  "typescript>typescript-eslint": "^8.62.1"
  "eslint-plugin-tsdoc>@typescript-eslint/utils": "^8.62.1"
  "parse-url": "^10.0.3"
  "oxc-parser": "^0.139.0"
  "yargs": "^18.0.0"
  "unctx@2.5.0>unplugin": "^3.3.0"
  "@commitlint/read": "^21.2.1"
# I tried overriding glob, instead, and it broke commitizen.
allowedDeprecatedVersions:
  "glob": "*"
  "inflight": "1.0.6"
  "prebuild-install": "7.1.3"
allowBuilds:
  esbuild: true
  sqlite3: true
  better-sqlite3: true
  '@parcel/watcher': true
  unrs-resolver: true
  '@eslint-community/eslint-utils': true
  '@typescript-eslint/eslint-plugin': true
  '@typescript-eslint/parser': true
  '@typescript-eslint/type-utils': true
  '@typescript-eslint/utils': true
  eslint-fix-utils: true
  eslint-json-compat-utils: true
  markdownlint-cli2-formatter-default: true
pmOnFail: ignore
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "undici-types@6.21.0"
  - "@oxc-parser/binding-darwin-arm64@0.68.1"
  - "@oxc-parser/binding-darwin-x64@0.68.1"
  - "@oxc-parser/binding-linux-arm-gnueabihf@0.68.1"
  - "@oxc-parser/binding-linux-arm64-gnu@0.68.1"
  - "@oxc-parser/binding-linux-arm64-musl@0.68.1"
  - "@oxc-parser/binding-linux-x64-gnu@0.68.1"
  - "@oxc-parser/binding-linux-x64-musl@0.68.1"
  - "@oxc-parser/binding-wasm32-wasi@0.68.1"
  - "@oxc-parser/binding-win32-arm64-msvc@0.68.1"
  - "@oxc-parser/binding-win32-x64-msvc@0.68.1"
  - "@oxc-transform/binding-darwin-arm64@0.68.1"
  - "@oxc-transform/binding-darwin-x64@0.68.1"
  - "@oxc-transform/binding-linux-arm-gnueabihf@0.68.1"
  - "@oxc-transform/binding-linux-arm64-gnu@0.68.1"
  - "@oxc-transform/binding-linux-arm64-musl@0.68.1"
  - "@oxc-transform/binding-linux-x64-gnu@0.68.1"
  - "@oxc-transform/binding-linux-x64-musl@0.68.1"
  - "@oxc-transform/binding-wasm32-wasi@0.68.1"
  - "@oxc-transform/binding-win32-arm64-msvc@0.68.1"
  - "@oxc-transform/binding-win32-x64-msvc@0.68.1"
  - "semver@6.3.1"
  - "enginematch@0.2.0"
minimumReleaseAgeExclude:
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-netbsd-x64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - "typescript@7.0.2"
  - '@commitlint/read@21.2.1'
updateConfig:
  ignoreDependencies:
    - "@types/node"
    # Until I review more closely
    - "@cloudflare/workers-types"
    # Until h3 2.0.1 is out of rc mode.
    - "h3"
    - "h3-compression"
patchedDependencies:
  publint@0.3.21: patches/publint@0.3.21.patch
