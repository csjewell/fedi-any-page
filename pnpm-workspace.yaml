  "shelljs": "^0.9.2"
  "node-gyp": "^11.2.0"
  "unplugin-isolated-decl@0.13.11>typescript": "^6.0.3"
  "typescript>typescript-eslint": "^8.62.1"
  "eslint-plugin-tsdoc>@typescript-eslint/utils": "^8.62.1"
  # I tried overriding glob, instead, and it broke commitizen.
allowedDeprecatedVersions:
  glob: "7.2.3"
  inflight: "1.0.6"
allowBuilds:
  esbuild: true
  sqlite3: true
  better-sqlite3: true
  '@parcel/watcher': true
  unrs-resolver: true
pmOnFail: ignore
