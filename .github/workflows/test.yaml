name: Integration Testing

on:
  push:
    branches:
      - release
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Deno modules
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: test-${{ github.ref_name }}-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            test-${{ github.ref_name }}-
            test-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: deno install --reload

      # Check if the code is formatted according to our
      # formatting conventions.
      - name: Check formatting
        run: deno fmt --check

      # Scan the code for syntax errors and style issues.
      # - name: Lint
      #   run: deno lint

      - name: Run tests
        run: deno test --allow-read --coverage=cov/

      - name: Create coverage report
        run: deno coverage --lcov cov/ > cov.lcov

      - name: Upload coverage report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          format: lcov


