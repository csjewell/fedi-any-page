name: Publish
on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: 23

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 23
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Cache Deno modules
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: publish-${{ github.ref_name }}-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            test-${{ github.ref_name }}-${{ hashFiles('**/deno.lock') }}
            publish-${{ github.ref_name }}-
            publish-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: deno install --reload

      - name: Publish types package to jsr
        run: cd packages/types && pnpm dlx jsr publish

      - name: Publish general package to jsr
        run: cd packages/general && pnpm dlx jsr publish

      - name: Publish eslint-config package to jsr
        run: cd packages/eslint-config && pnpm dlx jsr publish

      - name: Publish types package to npm
        run: cd packages/types && pnpm publish --access public

      - name: Publish general package to npm
        run: cd packages/general && pnpm publish --access public

      - name: Publish eslint-config package to jsr
        run: cd packages/eslint-config && pnpm publish --access public

