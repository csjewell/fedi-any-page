name: Publish
on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Deno modules
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: publish-${{ github.ref_name }}-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            test-${{ github.ref_name }}-${{ hashFiles('**/deno.lock') }}
            publish-${{ github.ref_name }}-
            publish-

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: deno install --reload

      - name: Publish json package
        run: cd json && deno publish

      - name: Publish general package
        run: cd general && deno publish

      - name: Publish database-cloudflare-d1 package
        run: cd database-cloudflare-d1 && deno publish

      - name: Publish workers-cloudflare package
        run: cd workers-cloudflare && deno publish

      - name: Publish handlers-response package
        run: cd handlers-response && deno publish
