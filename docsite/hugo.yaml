theme: E25DX
enableGitInfo: true
enableEmoji: true
baseURL: https://csjewell.github.io/activitypub-ts-kit/
defaultContentLanguage: en
frontmatter:
  lastmod:
    - :git
    - :fileModTime
    - lastmod
    - modified
    - date
    - publishdate
    - pubdate
    - published

outputs:
  taxonomy: []
  term: []
  section: []

languages:
  en:
    weight: 1
    languageName: English
    languageCode: en-US
    contentDir: content/en
    title: Fedi Any Page
    params:
      description: Documentation for a toolkit to help 'static page' blogs get on the Fediverse

services:
  googleAnalytics:
    ID: ~

markup:
  highlight:
    noClasses: false
  goldmark:
    extensions:
      extras:
        delete:
          enable: false
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true

params:
  project:
    startYear: ~
    presentYear: 2025
    github:
      repo: CSJewell/activitypub-ts-kit
    themeColor:
      light: '#ffffff'
      dark: '#101010'

  author:
    name: Curtis Jewell
    url: https://github.com/CSJewell/activitypub-ts-kit

  home:
    heading: Fedi Any Page
    headingSegment2: ActivityPub/Fediverse 'Static Page + Worker' Kit Documentation
    description: Documentation for a toolkit to help 'static page' blogs get on the Fediverse
    getStartedPath: /activitypub-ts-kit/docs

